<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Фикс</title>
  <meta name="description" content="Фикс — фильмы, игры, книги, сериалы. Личный дневник того, что посмотрено, прочитано и пройдено">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="Фикс — фильмы, игры, книги, сериалы. На главную">
      <span class="logo-mark" aria-hidden="true"><i style="--c:#FF5B37;--fi:#FFF6E8">ф</i><i style="--c:#C9F04B;--fi:#2B1810">и</i><i style="--c:#1E5A3A;--fi:#FFF6E8">к</i><i style="--c:#FF9ACB;--fi:#2B1810">с</i></span>
      <span class="logo-sub" aria-hidden="true"><b>ф</b>ильмы · <b>и</b>гры · <b>к</b>ниги · <b>с</b>ериалы</span>
    </a>
    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="globalSearchInput" type="search" placeholder="Поиск по названию, жанру, заметкам…" autocomplete="off" aria-label="Поиск по всем папкам">
      <div class="search-results" id="globalSearchResults" hidden></div>
    </div>
    <nav class="topnav" aria-label="Разделы">
      <a class="nav-pill" id="collectionsLink" href="#/collections">Подборки</a>
      <button class="icon-btn" id="trashBtn" type="button" aria-label="Корзина">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>
        <span class="trash-count" hidden></span>
      </button>
    </nav>
    <button class="btn btn--add" data-action="add" type="button"><span aria-hidden="true">+</span> Добавить</button>
  </header>

  <main id="app"></main>

  <div class="modal" id="entryOverlay" role="dialog" aria-modal="true" hidden>
    <div class="modal-backdrop"></div>
    <article class="sheet-card" id="entryModal"></article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/secrets.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/provider-google-books.js"></script>
  <script src="js/provider-tmdb.js"></script>
  <script src="js/provider-rawg.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/repository.js"></script>
  <script src="js/collections-repository.js"></script>
  <script src="js/covers.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/home.js"></script>
  <script src="js/category.js"></script>
  <script src="js/collections.js"></script>
  <script src="js/trash.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
