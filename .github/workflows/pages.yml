# Выкладывает «Фикс» на GitHub Pages при каждом пуше в рабочую ветку.
# Сборки нет — публикуются файлы репозитория как есть.
# js/secrets.js в репозиторий не попадает, поэтому на сайте поиск по каталогам
# работает только там, где ключ не нужен (Google Books).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/media-collections-design-h9481d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
